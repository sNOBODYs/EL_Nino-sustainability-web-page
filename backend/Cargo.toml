[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
tower-http = { version = "0.5", features = ["cors"] }
serde_json = "1"
dotenvy = "0.15"
chrono = "0.4"